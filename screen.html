<!DOCTYPE html>
<html>
<head>
  <title>CEG MYS RETRO NIGHT • SHAKE-it CHALLENGE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { 
      font-family: 'Courier New', Courier, monospace; 
      background-color: #0c0f1d;
      background-image: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 6px 100%;
      color: white; 
      padding: 25px; 
      margin: 0; 
      user-select: none; 
    }
    .header-container { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 3.4rem; margin: 0; text-transform: uppercase; letter-spacing: 4px; color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff; font-weight: 900; }
    .main-title-2 { font-size: 4rem; color: #ff007f; text-shadow: 0 0 10px #ff007f, 0 0 25px #ff007f, 0 0 50px #ff007f; letter-spacing: 5px; margin-top: 8px; }
    .subtitle { text-align: center; color: #ffbf00; font-size: 1.4rem; margin-top: 15px; margin-bottom: 25px; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 8px rgba(255, 191, 0, 0.7); }
    #controlBar { max-width: 1100px; margin: 0 auto 25px auto; background: #121526; border-radius: 12px; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border: 3px solid #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
    .btn-container { display: flex; gap: 12px; align-items: center; }
    .btn-control { background: #ff007f; color: white; font-family: inherit; font-size: 1.25rem; font-weight: bold; padding: 14px 28px; border-radius: 8px; border: none; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px #ff007f; transition: all 0.2s; }
    .btn-control:hover { background: #00ffff; color: #090b15; box-shadow: 0 0 25px #00ffff; }
    .btn-reset { background: #27272a; border: 2px solid #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); font-size: 1.1rem; padding: 14px 20px; }
    .btn-reset:hover { background: #ef4444; color: white; box-shadow: 0 0 20px #ef4444; }
    .btn-export { background: #10b981; border: 2px solid #34d399; box-shadow: 0 0 12px rgba(16, 185, 129, 0.5); font-size: 1.15rem; padding: 14px 22px; display: none; }
    .btn-export:hover { background: #059669; box-shadow: 0 0 22px #10b981; }
    .timer-box { font-size: 2.3rem; color: #00ffff; font-weight: bold; text-shadow: 0 0 10px #00ffff; }
    .round-info { font-size: 1.3rem; color: #ffbf00; font-weight: bold; text-shadow: 0 0 5px rgba(255,191,0,0.5); }
    #raceTrack { max-width: 1100px; margin: 0 auto; background: #121526; border-radius: 16px; padding: 25px; border: 3px solid #3d1b5c; box-shadow: 0 0 35px rgba(255, 0, 127, 0.15); min-height: 480px; }
    .racer { margin: 16px 0; background: #090b15; border-radius: 12px; padding: 5px; border: 2px solid #3d1b5c; position: relative; overflow: hidden; }
    .bar { height: 46px; background: linear-gradient(90deg, #ff007f, #b300ff, #00ffff, #ffbf00); border-radius: 8px; transition: width 0.3s cubic-bezier(0.1, 0.8, 0.3, 1); display: flex; align-items: center; padding-left: 15px; font-weight: bold; white-space: nowrap; font-size: 1.2rem; color: #FFFFFF; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>🕺 CEG MYS RETRO NIGHT 🕺</h1>
    <h1 class="main-title-2">✨ SHAKE-it CHALLENGE ✨</h1>
  </div>
  
  <div class="subtitle">🚀 HIT THE TURBO BOOST • GO FOR THE HIGH SCORE! 📼 🕹️</div>

  <!-- Host Controls Panel -->
  <div id="controlBar">
    <div class="round-info" id="roundStatus">ROUND 1 OF 3 (STANDBY)</div>
    <div class="timer-box" id="timeRemaining">30s</div>
    <div class="btn-container">
      <button class="btn-control btn-export" id="exportBtn" onclick="exportFullLeaderboard()">📥 EXPORT FULL RESULTS (CSV)</button>
      <button class="btn-control btn-reset" onclick="resetTournament()">⚠️ RESET ALL</button>
      <button class="btn-control" id="startBtn" onclick="triggerCountdown()">START ROUND 1</button>
    </div>
  </div>

  <!-- Realtime Track Arena -->
  <div id="raceTrack">
    <div id="standbyMessage" style="text-align: center; padding: 40px 50px; color: #64748B; font-size: 1.5rem; line-height: 1.8;">
      🕹️ READY EVERYONE... 🛼<br>
      <span style="color: #ff007f; text-shadow: 0 0 5px #ff007f; font-weight: bold;">Scan the QR code to join the dance floor!</span><br><br>
      
      <!-- Embedded Dynamic QR Code -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://sahma12.github.io/CEG-Retro-Shake/&color=ff007f&bgcolor=121526" 
           alt="Scan to Join" 
           style="border: 4px solid #00ffff; border-radius: 12px; box-shadow: 0 0 20px #00ffff; margin: 10px auto;"/><br><br>
      
      Press [START ROUND 1] when everyone is locked in!
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jtmctkvjfcqizcliimez.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KGzvBz2fj6wXguYTiz7c9A_YA4Du6wG';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentRound = 1;
    let roundTimeLeft = 30; 
    let isRacing = false;
    let timerInterval = null;
    let players = {}; 

    const channel = supabaseClient.channel('annual-dinner-race');

    channel.on('broadcast', { event: 'score_update' }, ({ payload }) => {
      players[payload.id] = {
        name: payload.name,
        roundScore: payload.roundScore,
        totalScore: payload.totalScore
      };
      if (isRacing) renderLeaderboard();
    }).subscribe();

    function triggerCountdown() {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.style.opacity = '0.5';

      let count = 3;
      const standbyMsg = document.getElementById('standbyMessage');
      if (standbyMsg) standbyMsg.style.display = 'none';
      
      document.getElementById('roundStatus').innerText = `🛸 ROUND ${currentRound} INCOMING...`;

      const countInterval = setInterval(() => {
        document.getElementById('timeRemaining').innerText = count;
        channel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: { action: 'countdown', round: currentRound, seconds: count }
        });

        count--;
        if (count < 0) {
          clearInterval(countInterval);
          startRound();
        }
      }, 1000);
    }

    function startRound() {
      isRacing = true;
      roundTimeLeft = 30; 

      Object.keys(players).forEach(id => { players[id].roundScore = 0; });

      document.getElementById('roundStatus').innerText = `⚡ ROUND ${currentRound} RUNNING! ⚡`;
      document.getElementById('timeRemaining').innerText = '30s';

      channel.send({
        type: 'broadcast',
        event: 'round_control',
        payload: { action: 'start', round: currentRound }
      });

      timerInterval = setInterval(() => {
        roundTimeLeft--;
        document.getElementById('timeRemaining').innerText = `${roundTimeLeft}s`;

        channel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: { action: 'tick', timeLeft: roundTimeLeft }
        });

        if (roundTimeLeft <= 0) {
          endRound();
        }
      }, 1000);
    }

    function endRound() {
      clearInterval(timerInterval);
      isRacing = false;

      channel.send({
        type: 'broadcast',
        event: 'round_control',
        payload: { action: 'end', round: currentRound }
      });

      renderLeaderboard(true); 

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.style.opacity = '1';

      if (currentRound < 3) {
        currentRound++;
        document.getElementById('roundStatus').innerText = `🏁 ROUND ${currentRound - 1} OVER! GET READY FOR ROUND ${currentRound}`;
        document.getElementById('timeRemaining').innerText = '30s';
        btn.innerText = `START ROUND ${currentRound}`;
      } else {
        document.getElementById('roundStatus').innerText = `👾 GAME OVER • TOURNAMENT FINISHED 👾`;
        document.getElementById('timeRemaining').innerText = '00s';
        btn.style.display = 'none';
        document.getElementById('exportBtn').style.display = 'inline-block';
      }
    }

    function resetTournament() {
      if (confirm("⚠️ Are you sure you want to RESET the entire game? This deletes all scores!")) {
        clearInterval(timerInterval);
        isRacing = false;
        currentRound = 1;
        roundTimeLeft = 30;
        players = {}; 

        // Send 'hard_reset' command to all connected players
        channel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: { action: 'hard_reset' }
        });

        document.getElementById('roundStatus').innerText = "ROUND 1 OF 3 (STANDBY)";
        document.getElementById('timeRemaining').innerText = "30s";
        
        const btn = document.getElementById('startBtn');
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.style.display = 'inline-block';
        btn.innerText = "START ROUND 1";
        document.getElementById('exportBtn').style.display = 'none';

        const track = document.getElementById('raceTrack');
        track.innerHTML = `
          <div id="standbyMessage" style="text-align: center; padding: 40px 50px; color: #64748B; font-size: 1.5rem; line-height: 1.8;">
            🕹️ READY EVERYONE... 🛼<br>
            <span style="color: #ff007f; text-shadow: 0 0 5px #ff007f; font-weight: bold;">Scan the QR code to join the dance floor!</span><br><br>
            
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://sahma12.github.io/CEG-Retro-Shake/&color=ff007f&bgcolor=121526" 
                 alt="Scan to Join" 
                 style="border: 4px solid #00ffff; border-radius: 12px; box-shadow: 0 0 20px #00ffff; margin: 10px auto;"/><br><br>
            
            Press [START ROUND 1] when everyone is locked in!
          </div>`;
      }
    }

    function renderLeaderboard(isFinalRoundReview = false) {
      const sorted = Object.values(players).sort((a, b) => b.totalScore - a.totalScore).slice(0, 10);
      const track = document.getElementById('raceTrack');
      if (sorted.length === 0) return;

      const topScore = sorted[0].totalScore || 1;

      track.innerHTML = sorted.map((p, index) => {
        const pct = Math.min(100, Math.max(12, Math.round((p.totalScore / (topScore * 1.15)) * 100)));
        let iconMarker = '';
        
        if (index === 0) iconMarker = '👑 🪩 ';
        else if (index === 1) iconMarker = '⚡ 📼 ';
        else if (index === 2) iconMarker = '✨ 🛼 ';
        else if (index === 3) iconMarker = '📻 ';
        else if (index === 4) iconMarker = '🕹️ ';
        else iconMarker = '👾 ';

        return `
          <div class="racer">
            <div class="bar" style="width: ${pct}%;">
              ${iconMarker}#${index + 1} ${p.name} — ${p.totalScore} pts (Round: ${p.roundScore})
            </div>
          </div>`;
      }).join('');
    }

    function exportFullLeaderboard() {
      const allSorted = Object.values(players).sort((a, b) => b.totalScore - a.totalScore);
      if (allSorted.length === 0) {
        alert("No player scores to export!");
        return;
      }

      let csvContent = "Rank,Player Info,Total Score,Final Round Score\n";
      allSorted.forEach((p, idx) => {
        const safeName = p.name ? `"${p.name.replace(/"/g, '""')}"` : '"Unknown"';
        csvContent += `${idx + 1},${safeName},${p.totalScore || 0},${p.roundScore || 0}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `CEG_Retro_Shake_Results_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>

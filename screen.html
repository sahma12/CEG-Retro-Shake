    let currentRound = 1;
    let roundTimeLeft = 30; 
    let isRacing = false;

    // Web Audio Synthesizer
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type, duration, volume = 0.2) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    // High-pitched, alarming retro-laser alarm siren
    function playAlarmSiren() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const duration = 1.6; // Alarm plays for 1.6 seconds
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sawtooth'; // Aggressive retro sound
        
        // Fast pitch modulation (Siren wobble)
        const now = ctx.currentTime;
        osc.frequency.setValueAtTime(800, now);
        // Sweep up and down extremely rapidly
        for (let i = 0; i < duration; i += 0.1) {
          osc.frequency.linearRampToValueAtTime(2200, now + i + 0.05); // High peak
          osc.frequency.linearRampToValueAtTime(900, now + i + 0.1);    // Low valley
        }

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(now + duration);
      } catch (e) {
        console.warn('Siren error:', e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.innerText = soundEnabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
      btn.style.background = soundEnabled ? '#3b82f6' : '#6b7280';
    }

    const channel = supabaseClient.channel('annual-dinner-race');

    channel.on('broadcast', { event: 'score_update' }, ({ payload }) => {
      players[payload.id] = {
        name: payload.name,
        roundScore: payload.roundScore,
        totalScore: payload.totalScore
      };
      if (isRacing) renderLeaderboard();
    }).subscribe();

    function triggerCountdown() {
      getAudioContext(); // Unlock browser audio
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.style.opacity = '0.5';

      let count = 3;
      const standbyMsg = document.getElementById('standbyMessage');
      if (standbyMsg) standbyMsg.style.display = 'none';
      
      document.getElementById('roundStatus').innerText = `🛸 ROUND ${currentRound} INCOMING...`;

      const countInterval = setInterval(() => {
        document.getElementById('timeRemaining').innerText = count;
        
        if (count > 0) {
          playTone(600, 'triangle', 0.2, 0.2); // Short retro alert beep
        }

        channel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: { action: 'countdown', round: currentRound, seconds: count }
        });

        count--;
        if (count < 0) {
          clearInterval(countInterval);
          playTone(1200, 'square', 0.4, 0.25); // Launch beep
          startRound();
        }
      }, 1000);
    }

    function startRound() {
      isRacing = true;
      roundTimeLeft = 30; 

      Object.keys(players).forEach(id => { players[id].roundScore = 0; });

      document.getElementById('roundStatus').innerText = `⚡ ROUND ${currentRound} RUNNING! ⚡`;
      document.getElementById('timeRemaining').innerText = '30s';

      channel.send({
        type: 'broadcast',
        event: 'round_control',
        payload: { action: 'start', round: currentRound }
      });

      timerInterval = setInterval(() => {
        roundTimeLeft--;
        document.getElementById('timeRemaining').innerText = `${roundTimeLeft}s`;

        channel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: { action: 'tick', timeLeft: roundTimeLeft }
        });

        if (roundTimeLeft <= 0) {
          endRound();
        }
      }, 1000);
    }

    function endRound() {
      clearInterval(timerInterval);
      isRacing = false;

      // Play the alarming laser-siren!
      playAlarmSiren();

      channel.send({
        type: 'broadcast',
        event: 'round_control',
        payload: { action: 'end', round: currentRound }
      });

      renderLeaderboard(true); 

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.style.opacity = '1';

      if (currentRound < 3) {
        currentRound++;

        document.getElementById('timeRemaining').innerText = '00s';
        btn.style.display = 'none';
        document.getElementById('exportBtn').style.display = 'inline-block';
      }
    }

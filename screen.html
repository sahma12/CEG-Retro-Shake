<!DOCTYPE html>
<html>
<head>
  <title>CEG MYS Retro Night - Projector Host</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Courier New', Courier, monospace; background: #090b15; color: white; padding: 25px; margin: 0; user-select: none; }
    h1 { text-align: center; color: #00ffff; font-size: 2.5rem; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 15px #00ffff; }
    .subtitle { text-align: center; color: #ff007f; font-size: 1.1rem; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 8px #ff007f; }
    
    /* Control Bar */
    #controlBar { max-width: 1100px; margin: 0 auto 20px auto; background: #121526; border-radius: 12px; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border: 2px solid #3d1b5c; }
    .btn-control { background: #ff007f; color: white; font-family: inherit; font-size: 1.2rem; font-weight: bold; padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px #ff007f; transition: all 0.2s; }
    .btn-control:hover { background: #00ffff; color: #090b15; box-shadow: 0 0 20px #00ffff; }
    .timer-box { font-size: 2rem; color: #00ffff; font-weight: bold; text-shadow: 0 0 10px #00ffff; }
    .round-info { font-size: 1.2rem; color: #ffbf00; font-weight: bold; }

    /* Leaderboard Track */
    #raceTrack { max-width: 1100px; margin: 0 auto; background: #121526; border-radius: 16px; padding: 20px 25px; border: 2px solid #3d1b5c; box-shadow: 0 0 30px rgba(255, 0, 127, 0.15); min-height: 480px; }
    .racer { margin: 12px 0; background: #090b15; border-radius: 10px; padding: 5px; border: 1px solid #3d1b5c; position: relative; overflow: hidden; }
    .bar { height: 42px; background: linear-gradient(90deg, #ff007f, #b300ff, #00ffff); border-radius: 6px;
           transition: width 0.3s cubic-bezier(0.1, 0.8, 0.3, 1); display: flex; align-items: center; padding-left: 12px;
           font-weight: bold; white-space: nowrap; font-size: 1.1rem; color: #FFFFFF; text-shadow: 2px 2px 4px rgba(0,0,0,0.9); }
  </style>
</head>
<body>
  <h1>👾 CEG MYS Retro Night Shake Race 👾</h1>
  <div class="subtitle">3 ROUNDS × 45 SECONDS • SHAKE FOR GLORY</div>

  <!-- Operator Controls -->
  <div id="controlBar">
    <div class="round-info" id="roundStatus">ROUND 1 OF 3 (STANDBY)</div>
    <div class="timer-box" id="timeRemaining">45s</div>
    <button class="btn-control" id="startBtn" onclick="triggerCountdown()">START ROUND 1</button>
  </div>

  <!-- Live Track -->
  <div id="raceTrack">
    <div id="standbyMessage" style="text-align: center; padding: 80px; color: #64748B; font-size: 1.4rem;">
      🚦 Players scanning QR code... Press [START ROUND 1] when ready!
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jtmctkvjfcqizcliimez.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KGzvBz2fj6wXguYTiz7c9A_YA4Du6wG';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentRound = 1;
    let roundTimeLeft = 45;
    let isRacing = false;
    let timerInterval = null;
    const players = {}; // Key: id, Value: { name, roundScore, totalScore }

    const channel = supabaseClient.channel('annual-dinner-race');

    // Receive player scores
    channel.on('broadcast', { event: 'score_update' }, ({ payload }) => {
      players[payload.id] = {
        name: payload.name,
        roundScore: payload.roundScore,
        totalScore: payload.totalScore
      };
      if (isRacing) renderLeaderboard();
    }).subscribe();

    function triggerCountdown() {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.style.opacity = '0.5';

      let count = 3;
      document.getElementById('standbyMessage') && (document.getElementById('standbyMessage').style.display = 'none');
      document.getElementById('roundStatus').innerText = `ROUND ${currentRound} STARTING...`;

      const countInterval = setInterval(() => {
        document.getElementById('timeRemaining').innerText = count;
        channel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: { action: 'countdown', round: currentRound, seconds: count }
        });

        count--;
        if (count < 0) {
          clearInterval(countInterval);
          startRound();
        }
      }, 1000);
    }

    function startRound() {
      isRacing = true;
      roundTimeLeft = 45;

      // Reset round scores for this round
      Object.keys(players).forEach(id => { players[id].roundScore = 0; });

      document.getElementById('roundStatus').innerText = `🔥 ROUND ${currentRound} OF 3 IN PROGRESS! 🔥`;
      document.getElementById('timeRemaining').innerText = '45s';

      channel.send({
        type: 'broadcast',
        event: 'round_control',
        payload: { action: 'start', round: currentRound }
      });

      timerInterval = setInterval(() => {
        roundTimeLeft--;
        document.getElementById('timeRemaining').innerText = `${roundTimeLeft}s`;

        channel.send({
          type: 'broadcast',
          event: 'round_control',
          payload: { action: 'tick', timeLeft: roundTimeLeft }
        });

        if (roundTimeLeft <= 0) {
          endRound();
        }
      }, 1000);
    }

    function endRound() {
      clearInterval(timerInterval);
      isRacing = false;

      channel.send({
        type: 'broadcast',
        event: 'round_control',
        payload: { action: 'end', round: currentRound }
      });

      renderLeaderboard(true); // Final standings for this round

      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.style.opacity = '1';

      if (currentRound < 3) {
        currentRound++;
        document.getElementById('roundStatus').innerText = `ROUND ${currentRound - 1} OVER! PREPARE FOR ROUND ${currentRound}`;
        document.getElementById('timeRemaining').innerText = '45s';
        btn.innerText = `START ROUND ${currentRound}`;
      } else {
        document.getElementById('roundStatus').innerText = `🏆 TOURNAMENT COMPLETE! FINAL OVERALL STANDINGS 🏆`;
        document.getElementById('timeRemaining').innerText = 'FINAL';
        btn.style.display = 'none';
      }
    }

    function renderLeaderboard(isFinalRoundReview = false) {
      // Sort by cumulative total score across rounds
      const sorted = Object.values(players).sort((a, b) => b.totalScore - a.totalScore).slice(0, 10);
      const track = document.getElementById('raceTrack');
      if (sorted.length === 0) return;

      const topScore = sorted[0].totalScore || 1;

      track.innerHTML = sorted.map((p, index) => {
        const pct = Math.min(100, Math.max(10, Math.round((p.totalScore / (topScore * 1.1)) * 100)));
        let medal = '';
        if (index === 0) medal = '🥇 ';
        else if (index === 1) medal = '🥈 ';
        else if (index === 2) medal = '🥉 ';

        return `
          <div class="racer">
            <div class="bar" style="width: ${pct}%;">
              ${medal}#${index + 1} ${p.name} — ${p.totalScore} pts (Round: ${p.roundScore}) 🏎️💨
            </div>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
